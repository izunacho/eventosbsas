name: Eliminar eventos finalizados

on:
  schedule:
    # 06:00 UTC = 03:00 America/Argentina/Buenos_Aires
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Eliminar eventos vencidos de data/events.json
        run: node scripts/prune-events.js

      - name: Commitear cambios si hay eventos eliminados
        run: |
          if git diff --quiet -- data/events.json; then
            echo "Sin cambios, no hay eventos vencidos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "chore: eliminar eventos finalizados (automatico)"
          git push
